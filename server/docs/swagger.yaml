basePath: /api/v1
definitions:
  api.CreateBookRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  api.CreateMonasteryRequest:
    properties:
      name:
        type: string
    type: object
  api.CreateReadingRequest:
    properties:
      book_id:
        type: integer
      customer_id:
        type: integer
      monk_id:
        type: integer
    type: object
  api.CreateUserRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      monastery_id:
        type: integer
      user_type:
        $ref: '#/definitions/user.UserType'
    type: object
  book.Book:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        type: integer
    type: object
  monastery.Monastery:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  reading.Reading:
    properties:
      book_id:
        type: integer
      customer_id:
        type: integer
      id:
        type: integer
      monk_id:
        type: integer
    type: object
  user.User:
    properties:
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      monastery_id:
        type: integer
      user_type:
        $ref: '#/definitions/user.UserType'
    type: object
  user.UserType:
    enum:
    - monk
    - customer
    type: string
    x-enum-varnames:
    - Monk
    - Customer
