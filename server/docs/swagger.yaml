basePath: /api/v1
definitions:
  apimodels.LoginResponse:
    properties:
      access_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  apimodels.ProblemDetails:
    properties:
      detail:
        type: string
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  appmodels.PageInfo:
    properties:
      hasMore:
        type: boolean
      nextCursor:
        type: string
    type: object
  appmodels.Paginated-models_Book:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Book'
        type: array
      pagination:
        $ref: '#/definitions/appmodels.PageInfo'
    type: object
  dtos.AddBookToCategoryRequest:
    properties:
      book_id:
        type: integer
    required:
    - book_id
    type: object
  dtos.CreateBookRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  dtos.CreateCategoryRequest:
    properties:
      name:
        type: string
    type: object
  dtos.CreateMonasteryRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dtos.CreateMonkRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      monastery_id:
        type: integer
      password:
        type: string
      phone_number:
        type: string
    required:
    - first_name
    - last_name
    - monastery_id
    - password
    type: object
  dtos.CreateReadingRequest:
    properties:
      book_id:
        type: integer
    type: object
  dtos.CreateUserRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      phone_number:
        type: string
    required:
    - first_name
    - last_name
    - password
    type: object
  dtos.LoginRequest:
    properties:
      email:
        format: email
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  enums.ReadingStatus:
    enum:
    - pending
    - scheduled
    - cancelled
    - refunded
    type: string
    x-enum-varnames:
    - Pending
    - Scheduled
    - Cancelled
    - Refunded
  models.Book:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        type: integer
    type: object
  models.Category:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.Monastery:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.Reading:
    properties:
      assigned_at:
        type: string
      book_id:
        type: integer
      created_at:
        type: string
      customer_id:
        type: integer
      id:
        type: integer
      monk_id:
        type: integer
      status:
        $ref: '#/definitions/enums.ReadingStatus'
    type: object
  models.User:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      monastery_id:
        type: integer
      phone_number:
        type: string
      user_type:
        $ref: '#/definitions/models.UserType'
    type: object
  models.UserType:
    enum:
    - monk
    - customer
    type: string
    x-enum-varnames:
    - Monk
    - Customer
info:
  contact: {}
  description: API for Open Monastery
  title: Open Monastery API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dtos.LoginRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apimodels.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Log in with an email address and password
      tags:
      - auth
  /books:
    get:
      parameters:
      - description: Page size (default 20, capped at 100)
        in: query
        name: limit
        type: integer
      - description: Last book ID from the previous page
        in: query
        name: cursor
        type: string
      - description: Search name or description
        in: query
        name: q
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appmodels.Paginated-models_Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get a page of books
      tags:
      - books
    post:
      consumes:
      - application/json
      parameters:
      - description: Book to create
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateBookRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Create a book
      tags:
      - books
  /books/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get Book
      tags:
      - books
  /books/{id}/categories:
    get:
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get categories belonging to a book
      tags:
      - books
  /categories:
    get:
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Category to create
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateCategoryRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Create a category
      tags:
      - categories
  /categories/{id}/books:
    get:
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Page size (default 20, capped at 100)
        in: query
        name: limit
        type: integer
      - description: Last book ID from the previous page
        in: query
        name: cursor
        type: string
      - description: Search name or description
        in: query
        name: q
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appmodels.Paginated-models_Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get books belonging to a category
      tags:
      - categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Book to add
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/dtos.AddBookToCategoryRequest'
      produces:
      - application/problem+json
      responses:
        "204":
          description: Book added
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Add a book to a category
      tags:
      - categories
  /monasteries:
    post:
      consumes:
      - application/json
      parameters:
      - description: Monastery to create
        in: body
        name: monastery
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateMonasteryRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Monastery'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Create a monastery
      tags:
      - monasteries
  /monasteries/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Monastery'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get a monastery
      tags:
      - monasteries
  /monks:
    post:
      consumes:
      - application/json
      description: Requires first_name, last_name, password, a positive monastery_id,
        and at least one of email or phone_number.
      parameters:
      - description: Monk to create
        in: body
        name: monk
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateMonkRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Create a monk
      tags:
      - monks
  /readings:
    post:
      consumes:
      - application/json
      description: Creates a pending reading for the authenticated requester.
      parameters:
      - description: Reading to create
        in: body
        name: reading
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateReadingRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Reading'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Create a reading
      tags:
      - readings
  /readings/{id}:
    get:
      consumes:
      - application/json
      description: Returns a reading owned by the authenticated requester.
      parameters:
      - description: Reading ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Reading'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Get a reading
      tags:
      - readings
  /users:
    post:
      consumes:
      - application/json
      description: Requires first_name, last_name, password, and at least one of email
        or phone_number. Creates a customer.
      parameters:
      - description: User to create
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateUserRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Create a user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Enter Bearer followed by a space and the JWT access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
