basePath: /api/v1
definitions:
  api.AddBookToCategoryRequest:
    properties:
      book_id:
        type: integer
    type: object
  api.CreateBookRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  api.CreateCategoryRequest:
    properties:
      name:
        type: string
    type: object
  api.CreateMonasteryRequest:
    properties:
      name:
        type: string
    type: object
  api.CreateReadingRequest:
    properties:
      book_id:
        type: integer
      customer_id:
        type: integer
      monk_id:
        type: integer
    type: object
  api.CreateUserRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      monastery_id:
        type: integer
      user_type:
        $ref: '#/definitions/user.UserType'
    type: object
  book.Book:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        type: integer
    type: object
  book.Page:
    properties:
      books:
        items:
          $ref: '#/definitions/book.Book'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: integer
    type: object
  category.Category:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  monastery.Monastery:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  reading.Reading:
    properties:
      book_id:
        type: integer
      createdAt:
        type: string
      customer_id:
        type: integer
      id:
        type: integer
      monk_id:
        type: integer
      status:
        $ref: '#/definitions/reading.Status'
    type: object
  reading.Status:
    enum:
    - pending
    - scheduled
    - cancelled
    - refunded
    type: string
    x-enum-varnames:
    - Pending
    - Scheduled
    - Cancelled
    - Refunded
  user.User:
    properties:
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      monastery_id:
        type: integer
      user_type:
        $ref: '#/definitions/user.UserType'
    type: object
  user.UserType:
    enum:
    - monk
    - customer
    type: string
    x-enum-varnames:
    - Monk
    - Customer
info:
  contact: {}
  description: API for Open Monastery
  title: Open Monastery API
  version: "1.0"
paths:
  /books:
    get:
      parameters:
      - description: Page size (default 20, capped at 100)
        in: query
        name: limit
        type: integer
      - description: Last book ID from the previous page
        in: query
        name: after_id
        type: integer
      - description: Search name or description
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/book.Page'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a page of books
      tags:
      - books
    post:
      consumes:
      - application/json
      parameters:
      - description: Book to create
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/api.CreateBookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/book.Book'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a book
      tags:
      - books
  /books/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/book.Book'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Book
      tags:
      - books
  /books/{id}/categories:
    get:
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
