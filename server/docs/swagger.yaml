basePath: /api/v1
definitions:
  apimodels.LoginResponse:
    properties:
      access_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  apimodels.ProblemDetails:
    properties:
      detail:
        type: string
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  appmodels.PageInfo:
    properties:
      hasMore:
        type: boolean
      nextCursor:
        type: string
    type: object
  appmodels.Paginated-models_Book:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Book'
        type: array
      pagination:
        $ref: '#/definitions/appmodels.PageInfo'
    type: object
  appmodels.Paginated-models_Monastery:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Monastery'
        type: array
      pagination:
        $ref: '#/definitions/appmodels.PageInfo'
    type: object
  appmodels.Paginated-models_Reading:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Reading'
        type: array
      pagination:
        $ref: '#/definitions/appmodels.PageInfo'
    type: object
  dtos.AddBookToCategoryRequest:
    properties:
      book_id:
        type: integer
    required:
    - book_id
    type: object
  dtos.CreateBookRequest:
    properties:
      description:
        type: string
      name:
        type: string
      price:
        type: integer
    type: object
  dtos.CreateCategoryRequest:
    properties:
      name:
        type: string
    type: object
  dtos.CreateMonasteryRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dtos.CreateMonkRequest:
    properties:
      email:
        format: email
        type: string
      first_name:
        type: string
      last_name:
        type: string
      monastery_id:
        type: integer
      password:
        type: string
      phone_number:
        type: string
    required:
    - first_name
    - last_name
    - monastery_id
    - password
    type: object
  dtos.CreateReadingRequest:
    properties:
      book_id:
        type: integer
    type: object
  dtos.CreateUserRequest:
    properties:
      email:
        format: email
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      phone_number:
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  dtos.CreateUserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      monastery_id:
        type: integer
      phone_number:
        type: string
      user_type:
        $ref: '#/definitions/enums.UserType'
    type: object
  dtos.LoginRequest:
    properties:
      email:
        format: email
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  enums.ReadingStatus:
    enum:
    - pending
    - scheduled
    - cancelled
    - refunded
    type: string
    x-enum-varnames:
    - Pending
    - Scheduled
    - Cancelled
    - Refunded
  enums.UserType:
    enum:
    - monk
    - customer
    - manager
    - admin
    type: string
    x-enum-varnames:
    - Monk
    - Customer
    - Manager
    - Admin
  models.Book:
    properties:
      createdAt:
        type: string
      createdBy:
        format: int64
        type: integer
      description:
        type: string
      id:
        format: int64
        type: integer
      monasteryId:
        format: int64
        type: integer
      name:
        type: string
      price:
        format: int32
        type: integer
    type: object
  models.Category:
    properties:
      createdAt:
        type: string
      createdBy:
        format: int64
        type: integer
      id:
        format: int64
        type: integer
      monasteryId:
        format: int64
        type: integer
      name:
        type: string
    type: object
  models.Email:
    type: object
  models.Monastery:
    properties:
      createdAt:
        type: string
      createdBy:
        format: int64
        type: integer
      id:
        format: int64
        type: integer
      name:
        type: string
    type: object
  models.PhoneNumber:
    type: object
  models.Reading:
    properties:
      assignedAt:
        description: AssignedAt is the UTC time when a monk claimed the reading, when
          recorded.
        type: string
      bookId:
        format: int64
        type: integer
      createdAt:
        description: CreatedAt is the UTC creation time, when recorded.
        type: string
      customerId:
        format: int64
        type: integer
      id:
        format: int64
        type: integer
      monasteryId:
        format: int64
        type: integer
      monkId:
        format: int64
        type: integer
      status:
        $ref: '#/definitions/enums.ReadingStatus'
    type: object
  models.User:
    properties:
      createdAt:
        type: string
      email:
        $ref: '#/definitions/models.Email'
      firstName:
        type: string
      id:
        format: int64
        type: integer
      lastName:
        type: string
      monasteryId:
        format: int64
        type: integer
      passwordHash:
        type: string
      phoneNumber:
        $ref: '#/definitions/models.PhoneNumber'
      userType:
        $ref: '#/definitions/enums.UserType'
    type: object
info:
  contact: {}
  description: API for Open Monastery
  title: Open Monastery API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dtos.LoginRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apimodels.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Log in with an email address and password
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: User to create
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateUserRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.CreateUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Create a user
      tags:
      - auth
  /auth/register/monks:
    post:
      consumes:
      - application/json
      parameters:
      - description: Monk to create
        in: body
        name: monk
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateMonkRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Create a monk
      tags:
      - auth
  /categories:
    post:
      consumes:
      - application/json
      description: Requires the Manager role for this monastery.
      parameters:
      - description: Category to create
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateCategoryRequest'
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Create a category
      tags:
      - categories
  /monasteries:
    get:
      parameters:
      - description: Page size (default 20, capped at 100)
        in: query
        name: limit
        type: integer
      - description: Next cursor from the previous page
        in: query
        name: cursor
        type: string
      - description: Search by monastery name
        in: query
        name: q
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appmodels.Paginated-models_Monastery'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get a page of monasteries
      tags:
      - monasteries
    post:
      consumes:
      - application/json
      parameters:
      - description: Monastery to create
        in: body
        name: monastery
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateMonasteryRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Monastery'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Create a monastery
      tags:
      - monasteries
  /monasteries/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Monastery'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get a monastery
      tags:
      - monasteries
  /monasteries/{id}/books:
    get:
      parameters:
      - description: Page size (default 20, capped at 100)
        in: query
        name: limit
        type: integer
      - description: Last book ID from the previous page
        in: query
        name: cursor
        type: string
      - description: Search name or description
        in: query
        name: q
        type: string
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appmodels.Paginated-models_Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get a page of books
      tags:
      - books
    post:
      consumes:
      - application/json
      description: Requires the Manager role for this monastery or the Admin role.
      parameters:
      - description: Book to create
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateBookRequest'
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Create a book
      tags:
      - books
  /monasteries/{id}/books/{bookId}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Book ID
        in: path
        name: bookId
        required: true
        type: integer
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get Book
      tags:
      - books
  /monasteries/{id}/books/{bookId}/categories:
    get:
      parameters:
      - description: Book ID
        in: path
        name: bookId
        required: true
        type: integer
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get categories belonging to a book
      tags:
      - books
  /monasteries/{id}/categories:
    get:
      parameters:
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get categories
      tags:
      - categories
  /monasteries/{id}/categories/{categoryId}/books:
    get:
      parameters:
      - description: Category ID
        in: path
        name: categoryId
        required: true
        type: integer
      - description: Page size (default 20, capped at 100)
        in: query
        name: limit
        type: integer
      - description: Last book ID from the previous page
        in: query
        name: cursor
        type: string
      - description: Search name or description
        in: query
        name: q
        type: string
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appmodels.Paginated-models_Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      summary: Get books belonging to a category
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Requires the Manager role for this monastery.
      parameters:
      - description: Category ID
        in: path
        name: categoryId
        required: true
        type: integer
      - description: Book to add
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/dtos.AddBookToCategoryRequest'
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/problem+json
      responses:
        "204":
          description: Book added
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Add a book to a category
      tags:
      - categories
  /monasteries/{id}/readings:
    get:
      description: Returns readings owned by the authenticated requester at the monastery.
      parameters:
      - description: Page size (default 20, capped at 100)
        in: query
        name: limit
        type: integer
      - description: Next cursor from the previous page
        in: query
        name: cursor
        type: string
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appmodels.Paginated-models_Reading'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Get a page of readings
      tags:
      - readings
    post:
      consumes:
      - application/json
      description: Creates a pending reading for the authenticated requester using
        a book from the monastery.
      parameters:
      - description: Reading to create
        in: body
        name: reading
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateReadingRequest'
      - description: Monastery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Reading'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apimodels.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Create a reading
      tags:
      - readings
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
